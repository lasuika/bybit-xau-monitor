name: bybit-monitor

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      test:
        description: 'Send a test phone notification only'
        type: boolean
        default: false
      probe_mark:
        description: 'providerMark to probe (skips monitoring)'
        type: string
        default: ''
      verify:
        description: 'Run cross-product verification sweep'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install deps
        run: npm install --no-fund --no-audit

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}
          restore-keys: |
            state-

      - name: Probe provider
        if: inputs.probe_mark != ''
        env:
          PROVIDER_MARK: ${{ inputs.probe_mark }}
        run: node probe.js

      - name: Cross-product verify
        if: inputs.verify == true
        timeout-minutes: 25
        run: node verify.js

      - name: Upload verify result
        if: inputs.verify == true
        uses: actions/upload-artifact@v4
        with:
          name: verify-result
          path: verify-result.json
          retention-days: 7

      - name: Run monitor
        if: inputs.probe_mark == '' && inputs.verify != true
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TEST_ALERT: ${{ inputs.test == true && '1' || '' }}
        run: node monitor_ci.js

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}
