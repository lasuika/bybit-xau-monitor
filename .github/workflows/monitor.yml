name: bybit-monitor

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      test:
        description: 'Send a test phone notification only'
        type: boolean
        default: false
      probe_mark:
        description: 'providerMark to probe (skips monitoring)'
        type: string
        default: ''
      verify:
        description: 'Run cross-product verification sweep'
        type: boolean
        default: false
      history_mark:
        description: 'providerMark to pull full trade history for'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  # The monitoring loop holds its slot for ~50 minutes, so one-off probes and
  # verification sweeps need their own group or they queue behind it.
  group: >-
    ${{ (inputs.probe_mark != '' || inputs.verify == true || inputs.test == true || inputs.history_mark != '')
        && format('oneoff-{0}', github.run_id) || 'monitor' }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install deps
        run: npm install --no-fund --no-audit

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}
          restore-keys: |
            state-

      - name: Probe provider
        if: inputs.probe_mark != ''
        env:
          PROVIDER_MARK: ${{ inputs.probe_mark }}
        run: node probe.js

      - name: Cross-product verify
        if: inputs.verify == true
        timeout-minutes: 25
        run: node verify.js

      - name: Upload verify result
        if: inputs.verify == true
        uses: actions/upload-artifact@v4
        with:
          name: verify-result
          path: verify-result.json
          retention-days: 7

      - name: Pull trade history
        if: inputs.history_mark != ''
        env:
          PROVIDER_MARK: ${{ inputs.history_mark }}
        run: node history.js > history-result.json 2>history.err || (cat history.err; exit 1)

      - name: Upload history
        if: inputs.history_mark != ''
        uses: actions/upload-artifact@v4
        with:
          name: history-result
          path: history-result.json
          retention-days: 7

      - name: Run monitor
        if: inputs.probe_mark == '' && inputs.verify != true && inputs.history_mark == ''
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TEST_ALERT: ${{ inputs.test == true && '1' || '' }}
          LOOP_MINUTES: ${{ inputs.test == true && '0' || '50' }}
          CHECK_EVERY_SEC: '90'
        run: node monitor_ci.js

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}
